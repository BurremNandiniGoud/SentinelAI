<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Currency Presence Gate</title>
  <base href="./">
  <link rel="stylesheet" href="style.css" />
</head>
<body style="margin:0;padding:24px;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f3f4f6;color:#111827;font-family:Inter,system-ui,sans-serif;">
  <div id="debug-banner" style="position:fixed;top:0;left:0;right:0;padding:12px 16px;background:#dc2626;color:white;font-weight:700;z-index:9999;text-align:center;">App is starting...</div>
  <script>
    setTimeout(() => {
      const status = document.getElementById('status');
      if (status && status.textContent === 'Initializing app...') {
        status.textContent = 'Waiting for TensorFlow.js to load...';
      }
    }, 5000);
  </script>
  <main class="page">
    <section class="card" style="background:#ffffff;border-radius:20px;padding:24px;box-shadow:0 18px 55px rgba(15,23,42,0.12);">
      <h1>Live Currency Detection</h1>
      <p>Place a banknote in the center of the camera view. The app shows a live Real/Fake result only when a note is detected.</p>

      <div class="video-wrapper" style="position:relative;width:100%;padding-top:56.25%;background:#0f172a;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
        <video id="camera" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></video>
        <canvas id="overlay" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;"></canvas>
      </div>

      <div class="info" style="margin-top:18px;display:grid;gap:10px;">
        <div id="status" class="status idle" style="padding:14px 16px;border-radius:14px;border:1px solid transparent;font-weight:600;background:#f8fafc;color:#475569;border-color:#e2e8f0;">Initializing app...</div>
        <div id="confidence" class="confidence" style="padding:14px 16px;border-radius:14px;border:1px solid #e2e8f0;background:#f8fafc;color:#475569;min-height:24px;"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
